# The live site is GitHub Pages serving the main branch as committed. This
# workflow rebuilds index.html, press.html and secondbrain.html from the
# Markdown copy sources on every push, and commits the result back when it
# differs, so an edit to index.md or secondbrain.md is enough to deploy.
name: Build pages from Markdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages from index.md and secondbrain.md
        run: npm run build
      - name: Run the site checks
        run: npm run check
      - name: Commit rebuilt pages when they changed
        run: |
          if git diff --quiet -- index.html press.html secondbrain.html; then
            echo "Built pages already match the committed HTML."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html press.html secondbrain.html
          git commit -m "Rebuild pages from Markdown copy"
          git push
